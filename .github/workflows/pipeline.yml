# Module 9/10 — one pipeline, three gated stages:
#   quality (lint, types, unit, build)  →  e2e (Playwright vs production build)  →  deploy (main only, OIDC → S3 + CloudFront)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR — saves minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege by default; the deploy job adds id-token

jobs:
  quality:
    name: Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to AWS
    needs: e2e
    # Runs only for pushes to main, and only once the AWS variables exist (Module 10). Until then it is skipped, not failed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # The environment name is part of the OIDC "sub" claim the IAM role trusts.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v5 # for the smoke test spec
      - uses: actions/download-artifact@v5
        with:
          name: dist # deploy the EXACT bytes that were tested — build once, promote
          path: dist

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets never change → cache for a year. index.html must always revalidate.
      - name: Upload hashed assets (immutable)
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths /index.html /tips.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        env:
          E2E_BASE_URL: ${{ vars.SITE_URL }}
        run: npx playwright test -g "tip of the day loads"
