AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TaskFlow Lite - static React SPA hosting. Private S3 bucket + CloudFront (Origin Access Control),
  plus a GitHub Actions OIDC deploy role (no long-lived AWS keys in GitHub).

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or org that owns the repo (e.g. ashok-g)
  GitHubRepo:
    Type: String
    Default: taskflow-lite
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment the deploy job runs in. It becomes part of the OIDC "sub" claim.
  GitHubOwnerId:
    Type: String
    Default: ''
    Description: >
      Numeric owner ID. Required for repos using GitHub's immutable OIDC subject format
      (all repos created after 15 July 2026). Find it with: gh api repos/OWNER/REPO --jq .owner.id
  GitHubRepoId:
    Type: String
    Default: ''
    Description: Numeric repository ID (gh api repos/OWNER/REPO --jq .id). Leave both IDs empty for older repos.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if token.actions.githubusercontent.com already exists in this account (only one is allowed).

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, 'true']
  UseImmutableSubject: !And
    - !Not [!Equals [!Ref GitHubOwnerId, '']]
    - !Not [!Equals [!Ref GitHubRepoId, '']]

Resources:
  # ---------- Storage: private bucket, never public ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------- CDN: CloudFront reads the bucket via OAC (SigV4-signed requests) ----------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TaskFlow Lite SPA
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # cheapest edge set (NA + EU); fine for a learning project
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: '' # must be empty when using OAC
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # AWS managed: SecurityHeadersPolicy
        # SPA routing: with OAC, a missing key returns 403 from S3. Serve index.html so client routing works.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---------- CI identity: GitHub OIDC -> short-lived STS credentials ----------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (OIDC) to publish TaskFlow Lite
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only the deploy job in THIS repo's production environment can assume the role.
                # New repos (after 15 Jul 2026) send owner@ownerId/repo@repoId: numeric IDs survive renames,
                # so a deleted-and-recreated repo with the same name can't inherit this trust.
                token.actions.githubusercontent.com:sub: !If
                  - UseImmutableSubject
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: deploy-site # least privilege: one bucket, one distribution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Value: !Ref SiteBucket
    Description: GitHub variable S3_BUCKET
  DistributionId:
    Value: !Ref Distribution
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
    Description: GitHub variable SITE_URL
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: GitHub variable AWS_ROLE_ARN
